<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DASH AHD | Global Vehicle Specs & Maintenance</title>
  <style>
    :root {
      --bg-color: #0b0d10;
      --card-bg: #15181e;
      --accent-color: #d4af37; /* Metallic Gold */
      --text-main: #f0f2f5;
      --text-muted: #8a94a6;
      --border-color: #262b35;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 40px;
    }

    .brand-header {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--accent-color);
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    select, input {
      width: 100%;
      background: #0d0f12;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    select:focus, input:focus {
      border-color: var(--accent-color);
      outline: none;
    }

    .report-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent-color);
      margin-top: 4px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
      background: #1b382b;
      color: #4ed995;
    }
  </style>
</head>
<body>

  <div class="brand-header">DASH AHD</div>

  <div class="dashboard-grid">
    <div class="panel">
      <h2 style="margin-top:0; font-weight: 300;">SELECT VEHICLE</h2>
      <div class="form-group">
        <label>Manufacturer</label>
        <select id="mfr-select"><option>Select Manufacturer...</option></select>
      </div>
      <div class="form-group">
        <label>Model</label>
        <select id="model-select" disabled><option>Select Model...</option></select>
      </div>
      <div class="form-group">
        <label>Year</label>
        <select id="year-select" disabled><option>Select Year...</option></select>
      </div>
      <div class="form-group">
        <label>Engine & Configuration</label>
        <select id="config-select" disabled><option>Select Variant...</option></select>
      </div>
      <div class="form-group">
        <label>How many KM has your car driven?</label>
        <input type="number" id="mileage-input" placeholder="e.g. 120000">
      </div>
    </div>

    <div class="panel">
      <h2 style="margin-top:0; font-weight: 300;">SPECIFICATIONS & SERVICE</h2>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div>
          <label>Recommended Viscosity</label>
          <div class="report-value" id="res-viscosity">--</div>
        </div>
        <div>
          <label>Capacity (With Filter)</label>
          <div class="report-value" id="res-capacity">--</div>
        </div>
        <div>
          <label>Oil Specification</label>
          <div class="report-value" style="font-size:16px; color: #fff;" id="res-spec">--</div>
        </div>
        <div>
          <label>Filter Part No.</label>
          <div class="report-value" style="font-size:16px; color: #fff;" id="res-filter">--</div>
        </div>
      </div>
      <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 25px 0;">
      <div>
        <label>Maintenance Status</label>
        <div style="margin-top: 10px;">
          <span class="status-badge" id="res-status">AWAITING SELECTION</span>
        </div>
      </div>
      <div style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div>
          <label>Remaining Distance</label>
          <div class="report-value" style="color: #fff;" id="res-remaining">--</div>
        </div>
        <div>
          <label>Next Service At</label>
          <div class="report-value" style="color: #fff;" id="res-next">--</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
